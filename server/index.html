<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Pitwall</title>
<style>
:root{--bg:#0d0f12;--card:#161a1f;--line:#262c34;--fg:#e6e9ee;--mute:#8a93a0;--thr:#3ecf6e;--brk:#ff4d4d;--clu:#4da3ff;--best:#b36bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0}
#sub{color:var(--mute);font-size:12px}
#status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--mute)}
#status.live{background:#173d24;color:var(--thr)}
main{display:grid;gap:12px;padding:12px 16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.wide{grid-column:1/-1}
.label{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.big{font-size:52px;font-weight:700;line-height:1}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.val{font-size:18px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;width:0;background:var(--fg)}
.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.pedals{display:flex;gap:6px;height:100px}
.pedal{width:16px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.pedal>i{position:absolute;bottom:0;left:0;right:0;height:0}
.tyres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tyre{border-radius:8px;padding:8px;background:var(--line);text-align:center;transition:background .5s}
.tyre b{display:block;font-size:22px}
#flags span{display:inline-block;padding:2px 8px;border-radius:4px;margin:6px 4px 0 0;font-size:12px;font-weight:700}
canvas{width:100%;height:160px;display:block;margin-top:8px}
.legend i{display:inline-block;width:10px;height:3px;margin:0 4px 3px 10px;vertical-align:middle}
table{width:100%;border-collapse:collapse;margin-top:6px}
td,th{text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:11px}
td:first-child,th:first-child{text-align:left}
tr.best td{color:var(--best);font-weight:600}
</style>
</head>
<body>
<header>
  <div><h1 id="track">Waiting for session…</h1><div id="sub"></div></div>
  <span id="status">OFFLINE</span>
</header>
<main>
  <section class="card">
    <div class="top">
      <div><div class="label">Gear</div><div class="big" id="gear">–</div></div>
      <div><div class="label">km/h</div><div class="big" id="spd">–</div></div>
      <div class="pedals">
        <div class="pedal"><i id="clu" style="background:var(--clu)"></i></div>
        <div class="pedal"><i id="brk" style="background:var(--brk)"></i></div>
        <div class="pedal"><i id="thr" style="background:var(--thr)"></i></div>
      </div>
    </div>
    <div class="row"><span class="label">RPM</span><span id="rpm">–</span></div>
    <div class="bar"><i id="rpmBar"></i></div>
  </section>

  <section class="card">
    <div class="row"><span class="label">Position</span><span class="val" id="pos">–</span></div>
    <div class="row"><span class="label">Lap</span><span class="val" id="lap">–</span></div>
    <div class="row"><span class="label">Current</span><span class="val" id="cur">–</span></div>
    <div class="row"><span class="label">Last</span><span class="val" id="last">–</span></div>
    <div class="row"><span class="label">Best</span><span class="val" id="best" style="color:var(--best)">–</span></div>
    <div class="row"><span class="label">Delta</span><span class="val" id="delta">–</span></div>
  </section>

  <section class="card">
    <div class="row"><span class="label">Fuel</span><span class="val" id="fuel">–</span></div>
    <div class="bar"><i id="fuelBar"></i></div>
    <div class="row"><span class="label">Est. laps</span><span id="fuelLaps">–</span></div>
    <div class="row"><span class="label">Air</span><span id="air">–</span></div>
    <div class="row"><span class="label">Track</span><span id="road">–</span></div>
    <div id="flags"></div>
  </section>

  <section class="card">
    <div class="label">Tyres · temp °C · pressure <span id="pUnit"></span> · wear</div>
    <div class="tyres" id="tyres"></div>
  </section>

  <section class="card wide">
    <div class="label legend">Inputs, last 20 s
      <i style="background:var(--thr)"></i>Throttle<i style="background:var(--brk)"></i>Brake<i style="background:var(--fg)"></i>Speed</div>
    <canvas id="trace"></canvas>
  </section>

  <section class="card wide">
    <div class="label">Laps this session</div>
    <table>
      <thead><tr><th>Lap</th><th>Time</th><th>S1</th><th>S2</th><th>S3</th><th>Fuel</th></tr></thead>
      <tbody id="laps"><tr><td colspan="6">No laps yet</td></tr></tbody>
    </table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const has = v => v !== null && v !== undefined;
const num = (v, d = 0) => has(v) ? (+v).toFixed(d) : '–';
const lapTime = s => has(s) && s > 0 ? Math.floor(s / 60) + ':' + (s % 60).toFixed(3).padStart(6, '0') : '–';
const pct = (v, max) => (max > 0 ? Math.min(100, Math.max(0, v / max * 100)) : 0) + '%';
const set = (id, text) => { $(id).textContent = text; };
const WHEELS = ['FL', 'FR', 'RL', 'RR'];
const FLAGS = [['flagG', 'GREEN', '#1f7a3a'], ['flagY', 'YELLOW', '#9a7a00'], ['flagB', 'BLUE', '#1f5fbf'],
               ['flagW', 'WHITE', '#666'], ['flagK', 'BLACK', '#000'], ['flagC', 'CHEQUERED', '#444']];
const TRACE_MS = 20000;
let lastTick = 0, trace = [], speedMax = 100;

$('tyres').innerHTML = WHEELS.map(w =>
  `<div class="tyre" id="ty${w}"><div class="label">${w}</div><b id="t${w}">–</b><small><span id="p${w}">–</span> · <span id="w${w}">–</span></small></div>`).join('');

// cold blue (40°C) -> green (85°C) -> red (120°C+); rough, generic thresholds
function tyreColor(t) {
  if (!has(t) || t <= 0) return '';
  const h = t < 85 ? 220 - 100 * Math.max(0, (t - 40) / 45) : 120 - 120 * Math.min(1, (t - 85) / 35);
  return `hsl(${h} 55% 28%)`;
}

function onState(s) {
  set('track', s.track || 'Waiting for session…');
  set('sub', [s.game, s.car, s.session].filter(Boolean).join(' · '));
  const laps = s.laps || [];
  const best = Math.min(...laps.map(l => l.t > 0 ? l.t : Infinity));
  $('laps').innerHTML = laps.slice().reverse().map(l =>
    `<tr${l.t === best ? ' class="best"' : ''}><td>${num(l.n)}</td><td>${lapTime(l.t)}</td>` +
    `<td>${num(l.s1, 3)}</td><td>${num(l.s2, 3)}</td><td>${num(l.s3, 3)}</td><td>${num(l.fuel, 2)}</td></tr>`
  ).join('') || '<tr><td colspan="6">No laps yet</td></tr>';
}

function onTick(d) {
  lastTick = Date.now();
  set('gear', has(d.gear) ? d.gear : '–');
  set('spd', num(d.spd));
  set('rpm', num(d.rpm));
  $('rpmBar').style.width = pct(d.rpm, d.rpmMax);
  $('rpmBar').style.background = d.rpm / d.rpmMax > 0.95 ? 'var(--brk)' : '';
  for (const k of ['thr', 'brk', 'clu']) $(k).style.height = pct(d[k], 100);

  set('pos', d.pos > 0 ? 'P' + d.pos : '–');
  set('lap', has(d.lap) ? d.lap + (d.lapsTotal > 0 ? ' / ' + d.lapsTotal : '') : '–');
  set('cur', lapTime(d.cur));
  set('last', lapTime(d.last));
  set('best', lapTime(d.best));
  const delta = $('delta');
  delta.textContent = has(d.delta) ? (d.delta > 0 ? '+' : '') + num(d.delta, 3) : '–';
  delta.style.color = !has(d.delta) ? '' : d.delta > 0 ? 'var(--brk)' : 'var(--thr)';

  set('fuel', num(d.fuel, 1));
  $('fuelBar').style.width = pct(d.fuel, d.fuelMax);
  set('fuelLaps', num(d.fuelLaps, 1));
  set('air', has(d.air) ? num(d.air, 1) + ' °C' : '–');
  set('road', has(d.road) ? num(d.road, 1) + ' °C' : '–');
  $('flags').innerHTML = FLAGS.filter(([k]) => d[k]).map(([, t, c]) => `<span style="background:${c}">${t}</span>`).join('') +
    (d.pit ? '<span style="background:#555">PIT LANE</span>' : '');

  set('pUnit', d.pUnit ? `(${d.pUnit})` : '');
  for (const w of WHEELS) {
    set('t' + w, num(d['t' + w]));
    set('p' + w, num(d['p' + w], 1));
    set('w' + w, has(d['w' + w]) ? num(d['w' + w]) + '%' : '–');
    $('ty' + w).style.background = tyreColor(d['t' + w]);
  }

  trace.push({ t: lastTick, thr: d.thr, brk: d.brk, spd: d.spd });
  while (trace[0].t < lastTick - TRACE_MS) trace.shift();
  if (d.spd > speedMax) speedMax = d.spd;
  draw();
}

const canvas = $('trace'), ctx = canvas.getContext('2d');
function draw() {
  const dpr = devicePixelRatio || 1, W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== W * dpr || canvas.height !== H * dpr) { canvas.width = W * dpr; canvas.height = H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = '#262c34'; ctx.lineWidth = 1;
  for (const f of [0.25, 0.5, 0.75]) { ctx.beginPath(); ctx.moveTo(0, H * f); ctx.lineTo(W, H * f); ctx.stroke(); }
  const line = (key, max, color) => {
    ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    trace.forEach((p, i) => {
      const x = W - (lastTick - p.t) / TRACE_MS * W, y = H - 2 - (p[key] || 0) / max * (H - 4);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  };
  line('spd', speedMax, '#e6e9ee');
  line('thr', 100, '#3ecf6e');
  line('brk', 100, '#ff4d4d');
}

setInterval(() => {
  const live = Date.now() - lastTick < 2000;
  set('status', live ? 'LIVE' : 'OFFLINE');
  $('status').className = live ? 'live' : '';
}, 500);

const es = new EventSource('events');
es.addEventListener('state', e => onState(JSON.parse(e.data)));
es.addEventListener('tick', e => onTick(JSON.parse(e.data)));
</script>
</body>
</html>
